<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Cards</title>
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        *
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }
        .cards
        {
            width: 300px;
            height: 390px;
            border: 2px solid red;
            margin: 20px;
            position: relative;
            overflow: hidden;
        }
        .card-img
        {
            width: 100%;
            height: 70%;
            border: 1px solid red;
            position: relative;
        }
        .card-img img
        {
            width: 100%;
            height: 100%;
            position: absolute;
        }
        .card-content
        {
            padding: 10px 10px;
        }
        .sale-container
        {
            position: absolute;
            top: 63%;
            left: 5px ;
            width: 60px;
            height: 22px;
            border: 1px solid black;
            text-align: center;
            border-radius: 20px;
            background: #fff;
            font-size: 14px;
        }
        .new-tag
        {
            position: absolute;
            padding: 10px 50px;
            background: #e63946;
            font-size: 14px;
            color: white;
            font-weight: 600;
            transform: rotate(45deg);
            top:25px;
            right:-40px;
            /* padding-left: 110px;
            padding-right: 60px; */
            transform-origin: center;
            animation: popScale 5s ease infinite;
        }
@keyframes popScale {
  0% {
    opacity: 0;
    transform: rotate(45deg) scale(0.2);
  }

  25% {
    opacity: 1;
    transform: rotate(45deg) scale(1.15);
  }

  40% {
    transform: rotate(45deg) scale(1);
  }

  100% {
    opacity: 1;
    transform: rotate(45deg) scale(1);
  }
}

    </style>
</head>
<body>
    <div class="cards">
    <div class="card-img">
        <img src="./Assete/img/card-hover-1.webp" alt="">
        <img src="./Assete/img/card1.webp" alt="">
    </div>
    <div class="card-content">
        <p>Miss Roze Silk Flawless Foundation</p>
        <i class="ri-star-fill"></i>
        <i class="ri-star-fill"></i>
        <i class="ri-star-fill"></i>
        <i class="ri-star-fill"></i>
        <i class="ri-star-half-fill"></i>(1742)
        <p><del>Rs.999</del> Rs.4999 PKR</p>
    </div>
    <div class="sale-container">
        <p>Sale</p>
    </div>
    <div class="new-tag">
        New Launch
    </div>
    </div>
</body>
</html>
